<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alica &amp; Emanuele — Le nostre foto</title>
<meta name="description" content="Le foto del matrimonio di Alica &amp; Emanuele. Guarda e scarica i tuoi ricordi.">
<meta name="theme-color" content="#7d9068">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- ============================================================= -->
<!--  CONFIGURAZIONE — MODIFICATE SOLO QUESTE RIGHE                 -->
<!-- ============================================================= -->
<script>
const CONFIG = {
  user:   "Emanu3l301121991",   // il vostro nome utente GitHub
  repo:   "Alica-Emanuele",       // il nome del repository
  branch: "main",                  // di solito "main"
  folder: "photos",                // la cartella con le foto (lasciate "photos")
  cover:  "cover.jpg",             // immagine di copertina (nella cartella principale del repo)
  data:   "· i nostri ricordi ·"   // data o frase mostrata sotto i nomi
};
</script>
<!-- ============================================================= -->

<style>
  :root{
    --cream:#faf6f0; --ink:#3d3a34; --muted:#8a8378;
    --sage:#9caf88; --sage-dark:#7d9068; --gold:#c9a86a;
    --line:#e7ded1; --shadow:0 10px 40px rgba(61,58,52,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Jost',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.1}

  /* ---------- HERO / COPERTINA ---------- */
  .hero{
    position:relative;min-height:88vh;min-height:88svh;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:64px 22px;overflow:hidden;
    background:radial-gradient(1200px 500px at 50% -10%, rgba(156,175,136,.18), transparent 60%),
               linear-gradient(180deg,#fffdf9 0%, var(--cream) 100%);
  }
  .hero__bg{
    position:absolute;inset:0;background-size:cover;background-position:center;
    opacity:0;transition:opacity 1s ease;
  }
  .hero.has-cover .hero__bg{opacity:1}
  .hero.has-cover::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(30,28,24,.28),rgba(30,28,24,.15) 40%,rgba(30,28,24,.55));
  }
  .hero__inner{position:relative;z-index:2;transition:color .6s}
  .hero.has-cover .hero__inner{color:#fff}
  .hero.has-cover .eyebrow,.hero.has-cover .date{color:rgba(255,255,255,.9)}
  .hero.has-cover h1{color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.35)}
  .hero.has-cover .intro{color:rgba(255,255,255,.92)}
  .hero.has-cover .hero__inner .amp{color:#f0d9a7}
  .eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:26px;font-weight:400}
  .hero h1{font-size:clamp(3rem,13vw,7rem);color:var(--ink);letter-spacing:.01em}
  .hero h1 .amp{color:var(--gold);font-style:italic;font-weight:400;display:inline-block;margin:0 .1em}
  .date{margin-top:20px;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--sage-dark)}
  .divider{width:60px;height:1px;background:var(--gold);margin:30px auto 0;position:relative}
  .divider::before,.divider::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .divider::before{left:-9px}.divider::after{right:-9px}
  .intro{max-width:520px;margin:26px auto 0;color:var(--muted);font-weight:300;font-size:1rem}
  .scroll-cue{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;font-size:24px;opacity:.7;animation:bob 2s infinite}
  .hero.has-cover .scroll-cue{color:#fff}
  @keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(7px)}}

  /* ---------- TOOLBAR ---------- */
  .toolbar{
    position:sticky;top:0;z-index:30;display:flex;align-items:center;justify-content:space-between;
    gap:12px;flex-wrap:wrap;padding:12px 18px;background:rgba(250,246,240,.9);
    backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
    padding-top:calc(12px + env(safe-area-inset-top,0));
  }
  .count{color:var(--muted);font-size:14px;letter-spacing:.04em}
  .count b{color:var(--ink);font-weight:500}
  .tools{display:flex;align-items:center;gap:10px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff}
  .lang button{font-family:'Jost';border:none;background:transparent;cursor:pointer;padding:8px 13px;
    font-size:13px;letter-spacing:.06em;color:var(--muted);transition:.2s}
  .lang button.active{background:var(--sage-dark);color:#fff}
  .btn{font-family:'Jost';cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;
    padding:11px 20px;border-radius:100px;font-size:14px;letter-spacing:.03em;background:var(--sage-dark);
    color:#fff;transition:.2s;box-shadow:0 6px 18px rgba(125,144,104,.28)}
  .btn:hover{background:#6b7d59;transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* ---------- GALLERY ---------- */
  .wrap{max-width:1240px;margin:0 auto;padding:34px 14px 90px}
  .gallery{columns:4 250px;column-gap:14px}
  .card{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:14px;overflow:hidden;
    background:#efe8dc;box-shadow:var(--shadow);cursor:pointer;
    opacity:0;transform:translateY(14px);transition:opacity .6s ease,transform .6s ease}
  .card.in{opacity:1;transform:none}
  .card img{width:100%;display:block;transition:transform .5s ease}
  .card:hover img{transform:scale(1.04)}
  .card .overlay{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;
    padding:12px;background:linear-gradient(to top,rgba(40,38,33,.45),transparent 45%);opacity:0;transition:.25s}
  .card:hover .overlay{opacity:1}
  .icon-btn{width:42px;height:42px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.92);
    display:grid;place-items:center;transition:.2s}
  .icon-btn:hover{background:#fff;transform:scale(1.08)}
  .icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}

  .status{text-align:center;padding:70px 20px;color:var(--muted)}
  .status h3{font-size:1.9rem;color:var(--ink);margin-bottom:8px}
  .status code{background:#efe8dc;padding:2px 8px;border-radius:6px;font-size:13px;color:var(--ink);font-family:ui-monospace,monospace}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--sage-dark);border-radius:50%;
    margin:0 auto 18px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ---------- LIGHTBOX ---------- */
  .lb{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;
    background:rgba(30,28,24,.94);backdrop-filter:blur(4px);touch-action:none}
  .lb.open{display:flex}
  .lb img{max-width:94vw;max-height:80vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.5);user-select:none}
  .lb-close,.lb-nav{position:absolute;background:rgba(255,255,255,.14);border:none;cursor:pointer;color:#fff;
    display:grid;place-items:center;border-radius:50%;transition:.2s}
  .lb-close{top:calc(18px + env(safe-area-inset-top,0));right:18px;width:46px;height:46px;font-size:22px}
  .lb-nav{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:26px}
  .lb-nav.prev{left:14px}.lb-nav.next{right:14px}
  .lb-close:hover,.lb-nav:hover{background:rgba(255,255,255,.3)}
  .lb-bar{position:absolute;bottom:calc(20px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);
    display:flex;gap:14px;align-items:center;color:#fff;font-size:14px;letter-spacing:.05em}
  .lb-download{background:var(--gold);color:#fff;border:none;cursor:pointer;padding:11px 20px;border-radius:100px;
    font-family:'Jost';font-size:14px;display:inline-flex;gap:8px;align-items:center;transition:.2s}
  .lb-download:hover{background:#b9975a}
  .lb-download svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(140%);background:var(--ink);
    color:#fff;padding:13px 24px;border-radius:100px;font-size:14px;box-shadow:var(--shadow);z-index:80;
    transition:.35s;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  footer{text-align:center;padding:44px 20px calc(60px + env(safe-area-inset-bottom,0));color:var(--muted);
    font-size:13px;letter-spacing:.06em;border-top:1px solid var(--line)}
  footer .names{font-family:'Cormorant Garamond';font-size:1.5rem;color:var(--ink);margin-bottom:6px}

  /* ---------- MOBILE ---------- */
  @media(max-width:900px){ .gallery{columns:3 200px} }
  @media(max-width:640px){
    .hero{min-height:82vh;min-height:82svh;padding:54px 20px}
    .gallery{columns:2 150px;column-gap:10px}
    .card{margin-bottom:10px;border-radius:12px}
    .card .overlay{opacity:1;background:linear-gradient(to top,rgba(40,38,33,.35),transparent 42%)} /* icone sempre visibili al tocco */
    .icon-btn{width:38px;height:38px}
    .wrap{padding:26px 10px 80px}
    .lb-nav{width:46px;height:46px;font-size:22px}
    .lb img{max-height:74vh}
    .intro{font-size:.95rem}
  }
  @media(max-width:380px){ .gallery{columns:2 130px} }
</style>
</head>
<body>

  <header class="hero" id="hero">
    <div class="hero__bg" id="hero-bg"></div>
    <div class="hero__inner">
      <div class="eyebrow" id="t-eyebrow">Il nostro matrimonio</div>
      <h1>Alica <span class="amp">&amp;</span> Emanuele</h1>
      <div class="date" id="wedding-date"></div>
      <div class="divider"></div>
      <p class="intro" id="t-intro">Grazie per aver condiviso con noi questo giorno.
         Qui trovate tutte le foto: guardatele quando volete e scaricate le vostre preferite.</p>
    </div>
    <div class="scroll-cue">&#8595;</div>
  </header>

  <nav class="toolbar">
    <span class="count"><b id="photo-count">0</b> <span id="t-count-label">foto</span></span>
    <div class="tools">
      <div class="lang" id="lang" role="group" aria-label="Lingua / Sprache">
        <button data-lang="it" class="active">IT</button>
        <button data-lang="de">DE</button>
      </div>
      <button class="btn" id="download-all" disabled>
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        <span id="t-dlall">Scarica tutte</span>
      </button>
    </div>
  </nav>

  <main class="wrap">
    <div class="gallery" id="gallery"></div>
    <div class="status" id="status">
      <div class="spinner"></div>
      <p>Carico le foto…</p>
    </div>
  </main>

  <div class="lb" id="lb">
    <button class="lb-close" id="lb-close" aria-label="Chiudi">&times;</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="Precedente">&#8249;</button>
    <img id="lb-img" src="" alt="">
    <button class="lb-nav next" id="lb-next" aria-label="Successiva">&#8250;</button>
    <div class="lb-bar">
      <span id="lb-counter"></span>
      <button class="lb-download" id="lb-download">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        Scarica
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <footer>
    <div class="names">Alica &amp; Emanuele</div>
    <div id="footer-tag">Con amore &middot; grazie di cuore</div>
  </footer>

<script>
const IMG_RE = /\.(jpe?g|png|gif|webp|avif)$/i;
let photos = [];   // [{name, url}]
let current = 0;

const $ = id => document.getElementById(id);
const configured = () => CONFIG.user && !/TUO-USERNAME/i.test(CONFIG.user);

// ---------- lingue ----------
const I18N = {
  it:{
    htmlLang:"it", eyebrow:"Il nostro matrimonio",
    intro:"Grazie per aver condiviso con noi questo giorno. Qui trovate tutte le foto: guardatele quando volete e scaricate le vostre preferite.",
    count:"foto", dlall:"Scarica tutte", dlone:"Scarica",
    loading:"Carico le foto…", download:"Download avviato",
    footer:"Con amore · grazie di cuore",
    emptyOnlineT:"Ancora nessuna foto", emptyOnlineP:f=>`Caricate le immagini nella cartella <code>${f}/</code> del repository e appariranno qui da sole.`,
    emptyLocalT:"Anteprima locale", emptyLocalP:"Online le foto si caricano da sole dalla cartella GitHub.<br>Per l'anteprima locale usate <code>photos.json</code>.",
    prep:(a,b)=>`Preparo ${a} di ${b}…`, zip:"Creo il file zip…", done:"Fatto! Download avviato"
  },
  de:{
    htmlLang:"de", eyebrow:"Unsere Hochzeit",
    intro:"Danke, dass ihr diesen Tag mit uns geteilt habt. Hier findet ihr alle Fotos: schaut sie euch an, wann ihr möchtet, und ladet eure Lieblingsbilder herunter.",
    count:"Fotos", dlall:"Alle herunterladen", dlone:"Herunterladen",
    loading:"Fotos werden geladen…", download:"Download gestartet",
    footer:"In Liebe · von Herzen danke",
    emptyOnlineT:"Noch keine Fotos", emptyOnlineP:f=>`Ladet die Bilder in den Ordner <code>${f}/</code> des Repositorys hoch – sie erscheinen dann automatisch hier.`,
    emptyLocalT:"Lokale Vorschau", emptyLocalP:"Online werden die Fotos automatisch aus dem GitHub-Ordner geladen.<br>Für die lokale Vorschau nutzt <code>photos.json</code>.",
    prep:(a,b)=>`Bereite ${a} von ${b} vor…`, zip:"ZIP-Datei wird erstellt…", done:"Fertig! Download gestartet"
  }
};
let lang = (localStorage.getItem('ae_lang')) || (navigator.language||'it').slice(0,2);
if(!I18N[lang]) lang = 'it';
const T = () => I18N[lang];

function applyLang(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  $('t-eyebrow').textContent = t.eyebrow;
  $('t-intro').textContent = t.intro;
  $('t-count-label').textContent = t.count;
  $('t-dlall').textContent = t.dlall;
  $('lb-download').lastChild.textContent = ' '+t.dlone;
  $('footer-tag').textContent = t.footer;
  document.querySelectorAll('#lang button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  renderStatus();
}
document.getElementById('lang').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  lang = b.dataset.lang; localStorage.setItem('ae_lang',lang); applyLang();
});

// ---------- copertina ----------
function setCover(){
  if(!CONFIG.cover) return;
  const src = configured()
    ? `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/${CONFIG.cover}`
    : CONFIG.cover;
  const test = new Image();
  test.onload = ()=>{ $('hero-bg').style.backgroundImage = `url("${src}")`; $('hero').classList.add('has-cover'); };
  test.src = src;
}

// ---------- carica elenco foto ----------
let state = 'loading';   // loading | empty | done

async function load(){
  $('wedding-date').textContent = CONFIG.data || '';
  setCover();
  applyLang();

  if(configured()){
    try{ await loadFromGitHub(); }
    catch(e){ await loadFromLocal(); }
  }else{
    await loadFromLocal();   // anteprima locale con photos.json
  }
  render();
}

function renderStatus(){
  const status = $('status'), t = T();
  if(state==='loading'){
    status.style.display='';
    status.innerHTML = '<div class="spinner"></div><p>'+t.loading+'</p>';
  }else if(state==='empty'){
    status.style.display='';
    status.innerHTML = configured()
      ? '<h3>'+t.emptyOnlineT+'</h3><p>'+t.emptyOnlineP(CONFIG.folder)+'</p>'
      : '<h3>'+t.emptyLocalT+'</h3><p>'+t.emptyLocalP+'</p>';
  }else{
    status.style.display='none';
  }
}

async function loadFromGitHub(){
  const api = `https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`;
  const res = await fetch(api);
  if(!res.ok) throw new Error('API '+res.status);
  const items = await res.json();
  photos = items
    .filter(f => f.type==='file' && IMG_RE.test(f.name))
    .sort((a,b)=> a.name.localeCompare(b.name, 'it', {numeric:true}))
    .map(f => ({ name:f.name, url:f.download_url }));
}

async function loadFromLocal(){
  try{
    const res = await fetch('photos.json?v='+Date.now());
    const data = await res.json();
    const list = data.photos || data;
    photos = list.map(p => typeof p==='string' ? {name:p, url:'photos/'+encodeURIComponent(p)} : {name:p.file, url:'photos/'+encodeURIComponent(p.file)});
  }catch(e){ photos = []; }
}

// ---------- render galleria ----------
function render(){
  const gallery = $('gallery');
  $('photo-count').textContent = photos.length;

  if(!photos.length){ state='empty'; renderStatus(); return; }
  state='done'; renderStatus();
  $('download-all').disabled = false;

  const frag = document.createDocumentFragment();
  photos.forEach((p,i)=>{
    const card = document.createElement('figure');
    card.className='card';
    card.innerHTML =
      '<img loading="lazy" src="'+p.url+'" alt="Foto matrimonio">'+
      '<div class="overlay"><button class="icon-btn" title="Scarica" data-dl="'+i+'">'+
      '<svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button></div>';
    card.querySelector('img').addEventListener('click',()=>openLb(i));
    card.querySelector('[data-dl]').addEventListener('click',ev=>{ev.stopPropagation();downloadOne(i);});
    frag.appendChild(card);
  });
  gallery.appendChild(frag);

  const io = new IntersectionObserver(ents=>ents.forEach(en=>{
    if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }
  },{threshold:.06}));
  document.querySelectorAll('.card').forEach(c=>io.observe(c));
}

// ---------- download ----------
async function downloadOne(i){
  const p = photos[i];
  try{ const b = await (await fetch(p.url)).blob(); saveBlob(b, p.name); }
  catch(e){ window.open(p.url,'_blank'); }
}
function saveBlob(blob,name){
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a'); a.href=url; a.download=name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),1500);
}
$('download-all').addEventListener('click', async ()=>{
  if(!photos.length) return;
  const btn=$('download-all'); btn.disabled=true;
  const zip=new JSZip(); const folder=zip.folder('Alica-Emanuele-Foto');
  for(let i=0;i<photos.length;i++){
    toast(T().prep(i+1, photos.length));
    try{ const b=await (await fetch(photos[i].url)).blob(); folder.file(photos[i].name,b); }catch(e){}
  }
  toast(T().zip);
  const out=await zip.generateAsync({type:'blob'});
  saveBlob(out,'Alica-Emanuele-Foto.zip');
  toast(T().done, 2800);
  btn.disabled=false;
});

// ---------- lightbox ----------
function openLb(i){
  current=i;
  $('lb-img').src=photos[i].url;
  $('lb-counter').textContent=(i+1)+' / '+photos.length;
  $('lb').classList.add('open'); document.body.style.overflow='hidden';
}
function closeLb(){ $('lb').classList.remove('open'); document.body.style.overflow=''; }
function nav(d){ current=(current+d+photos.length)%photos.length; openLb(current); }
$('lb-close').onclick=closeLb; $('lb-prev').onclick=()=>nav(-1); $('lb-next').onclick=()=>nav(1);
$('lb-download').onclick=()=>downloadOne(current);
$('lb').addEventListener('click',e=>{ if(e.target.id==='lb') closeLb(); });
document.addEventListener('keydown',e=>{
  if(!$('lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLb();
  if(e.key==='ArrowLeft') nav(-1);
  if(e.key==='ArrowRight') nav(1);
});
// swipe su mobile
let tx=0,ty=0;
$('lb').addEventListener('touchstart',e=>{tx=e.changedTouches[0].clientX;ty=e.changedTouches[0].clientY;},{passive:true});
$('lb').addEventListener('touchend',e=>{
  const dx=e.changedTouches[0].clientX-tx, dy=e.changedTouches[0].clientY-ty;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) nav(dx<0?1:-1);
  else if(dy>90 && Math.abs(dy)>Math.abs(dx)) closeLb();
},{passive:true});

// ---------- toast ----------
let toastTimer;
function toast(msg,hide){
  const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); if(hide) toastTimer=setTimeout(()=>t.classList.remove('show'),hide);
}

load();
</script>
</body>
</html>
