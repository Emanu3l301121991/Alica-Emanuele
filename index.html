<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Alica &amp; Emanuele — Le nostre foto</title>
<meta name="description" content="Le foto del matrimonio di Alica &amp; Emanuele.">
<meta name="theme-color" content="#7d9068">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<!-- ============================================================= -->
<!--  CONFIGURAZIONE — MODIFICATE SOLO QUESTE RIGHE                 -->
<!-- ============================================================= -->
<script>
const CONFIG = {
  user:   "Emanu3l301121991",      // nome utente GitHub
  repo:   "Alica-Emanuele",        // nome del repository
  branch: "main",
  folder: "photos",
  cover:  "cover.jpg",
  data:   "· i nostri ricordi ·",  // data o frase sotto i nomi
  pin:    "2026",                  // PIN d'accesso (vuoto "" = nessun PIN)
  sections: true                   // titoli di sezione (Cerimonia/Esterni/Festa)
};
</script>
<!-- ============================================================= -->

<style>
  :root{
    --cream:#faf6f0; --ink:#3d3a34; --muted:#8a8378;
    --sage:#9caf88; --sage-dark:#7d9068; --gold:#c9a86a;
    --line:#e7ded1; --shadow:0 10px 40px rgba(61,58,52,.12);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
  body{font-family:'Jost',sans-serif;color:var(--ink);background:var(--cream);line-height:1.6;-webkit-font-smoothing:antialiased}
  h1,h2,h3{font-family:'Cormorant Garamond',serif;font-weight:500;line-height:1.1}
  img{display:block}

  /* ================= PIN GATE ================= */
  .gate{position:fixed;inset:0;z-index:200;display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;padding:30px;background:linear-gradient(180deg,#fffdf9,#f3ece0);transition:opacity .5s}
  .gate__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.28;filter:saturate(.9)}
  .gate__card{position:relative;z-index:2;max-width:360px;width:100%}
  .gate .eyebrow{letter-spacing:.4em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:18px}
  .gate h1{font-size:clamp(2.6rem,10vw,3.6rem);color:var(--ink);margin-bottom:6px}
  .gate h1 .amp{color:var(--gold);font-style:italic}
  .gate p{color:var(--muted);margin:18px 0 14px;font-size:.95rem}
  .pin-row{display:flex;gap:8px;justify-content:center}
  .pin-row input{flex:1;max-width:220px;font-family:'Jost';font-size:1.3rem;letter-spacing:.4em;text-align:center;
    padding:14px 16px;border:1px solid var(--line);border-radius:14px;background:#fff;color:var(--ink);outline:none}
  .pin-row input:focus{border-color:var(--sage-dark)}
  .pin-row button{border:none;cursor:pointer;background:var(--sage-dark);color:#fff;padding:0 20px;border-radius:14px;
    font-family:'Jost';font-size:1rem;transition:.2s}
  .pin-row button:hover{background:#6b7d59}
  .gate .err{color:#b5544e;font-size:.85rem;height:18px;margin-top:10px;opacity:0;transition:.2s}
  .gate .err.show{opacity:1}
  .gate .glang{margin-top:26px;display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff}
  .gate .glang button{border:none;background:transparent;cursor:pointer;padding:7px 14px;font-family:'Jost';
    font-size:12px;letter-spacing:.06em;color:var(--muted)}
  .gate .glang button.active{background:var(--sage-dark);color:#fff}

  /* ================= HERO ================= */
  .hero{position:relative;min-height:82vh;min-height:82svh;display:flex;flex-direction:column;align-items:center;
    justify-content:center;text-align:center;padding:60px 22px;overflow:hidden;
    background:radial-gradient(1200px 500px at 50% -10%, rgba(156,175,136,.18), transparent 60%),linear-gradient(180deg,#fffdf9,var(--cream))}
  .hero__bg{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transition:opacity 1s}
  .hero.has-cover .hero__bg{opacity:1}
  .hero.has-cover::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(30,28,24,.3),rgba(30,28,24,.12) 40%,rgba(30,28,24,.6))}
  .hero__inner{position:relative;z-index:2}
  .hero.has-cover .hero__inner{color:#fff}
  .hero.has-cover .eyebrow,.hero.has-cover .date{color:rgba(255,255,255,.9)}
  .hero.has-cover h1{color:#fff;text-shadow:0 2px 30px rgba(0,0,0,.4)}
  .hero.has-cover .intro{color:rgba(255,255,255,.92)}
  .hero.has-cover .amp{color:#f0d9a7}
  .eyebrow{letter-spacing:.42em;text-transform:uppercase;font-size:11px;color:var(--muted);margin-bottom:24px}
  .hero h1{font-size:clamp(3rem,13vw,7rem);color:var(--ink)}
  .hero h1 .amp{color:var(--gold);font-style:italic;margin:0 .1em}
  .date{margin-top:18px;letter-spacing:.32em;text-transform:uppercase;font-size:12px;color:var(--sage-dark)}
  .divider{width:60px;height:1px;background:var(--gold);margin:26px auto 0;position:relative}
  .divider::before,.divider::after{content:"";position:absolute;top:-2px;width:5px;height:5px;border-radius:50%;background:var(--gold)}
  .divider::before{left:-9px}.divider::after{right:-9px}
  .intro{max-width:520px;margin:24px auto 0;color:var(--muted);font-weight:300}
  .scroll-cue{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:2;font-size:24px;opacity:.7;animation:bob 2s infinite}
  .hero.has-cover .scroll-cue{color:#fff}
  @keyframes bob{0%,100%{transform:translateX(-50%)}50%{transform:translateX(-50%) translateY(7px)}}

  /* ================= TOOLBAR ================= */
  .toolbar{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:12px;
    flex-wrap:wrap;padding:12px 18px;background:rgba(250,246,240,.92);backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);padding-top:calc(12px + env(safe-area-inset-top,0))}
  .count{color:var(--muted);font-size:14px;letter-spacing:.04em}
  .count b{color:var(--ink);font-weight:500}
  .tools{display:flex;align-items:center;gap:10px}
  .lang{display:inline-flex;border:1px solid var(--line);border-radius:100px;overflow:hidden;background:#fff}
  .lang button{font-family:'Jost';border:none;background:transparent;cursor:pointer;padding:8px 13px;font-size:13px;
    letter-spacing:.06em;color:var(--muted);transition:.2s}
  .lang button.active{background:var(--sage-dark);color:#fff}
  .btn{font-family:'Jost';cursor:pointer;border:none;display:inline-flex;align-items:center;gap:8px;padding:11px 18px;
    border-radius:100px;font-size:14px;letter-spacing:.03em;background:var(--sage-dark);color:#fff;transition:.2s;
    box-shadow:0 6px 18px rgba(125,144,104,.28)}
  .btn:hover{background:#6b7d59;transform:translateY(-1px)}
  .btn:disabled{opacity:.55;cursor:default;transform:none;box-shadow:none}
  .btn svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8}

  /* ================= SEZIONI + GALLERY ================= */
  .wrap{max-width:1280px;margin:0 auto;padding:20px 14px 90px}
  .sec{margin-top:46px}
  .sec:first-child{margin-top:28px}
  .sec-head{display:flex;align-items:center;gap:16px;margin:0 4px 20px}
  .sec-head h2{font-size:clamp(1.7rem,4vw,2.4rem);color:var(--ink);white-space:nowrap}
  .sec-head .ln{flex:1;height:1px;background:var(--line)}
  .sec-head .n{color:var(--muted);font-size:13px;letter-spacing:.06em}
  .gallery{columns:4 260px;column-gap:14px}
  .card{break-inside:avoid;margin-bottom:14px;position:relative;border-radius:14px;overflow:hidden;background:#efe8dc;
    box-shadow:var(--shadow);cursor:zoom-in;opacity:0;transform:translateY(14px);
    transition:opacity .6s,transform .6s;min-height:60px}
  .card.in{opacity:1;transform:none}
  .card img{width:100%;transition:transform .5s}
  .card:hover img{transform:scale(1.04)}
  .card .ov{position:absolute;inset:0;display:flex;align-items:flex-end;justify-content:flex-end;padding:10px;
    background:linear-gradient(to top,rgba(40,38,33,.4),transparent 45%);opacity:0;transition:.25s}
  .card:hover .ov{opacity:1}
  .icon-btn{width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;background:rgba(255,255,255,.94);
    display:grid;place-items:center;transition:.2s}
  .icon-btn:hover{background:#fff;transform:scale(1.08)}
  .icon-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:1.8}

  .status{text-align:center;padding:70px 20px;color:var(--muted)}
  .status h3{font-size:1.9rem;color:var(--ink);margin-bottom:8px}
  .status code{background:#efe8dc;padding:2px 8px;border-radius:6px;font-size:13px;color:var(--ink);font-family:ui-monospace,monospace}
  .spinner{width:34px;height:34px;border:3px solid var(--line);border-top-color:var(--sage-dark);border-radius:50%;margin:0 auto 18px;animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}

  /* ================= LIGHTBOX ================= */
  .lb{position:fixed;inset:0;z-index:120;display:none;align-items:center;justify-content:center;
    background:rgba(24,22,19,.96);touch-action:none;overflow:hidden}
  .lb.open{display:flex}
  .lb__stage{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
  .lb img{max-width:96vw;max-height:88vh;border-radius:6px;box-shadow:0 20px 60px rgba(0,0,0,.5);
    user-select:none;-webkit-user-drag:none;transition:transform .08s linear;will-change:transform}
  .lb img.zoomed{cursor:grab}
  .lb-close,.lb-nav{position:absolute;background:rgba(255,255,255,.14);border:none;cursor:pointer;color:#fff;
    display:grid;place-items:center;border-radius:50%;transition:.2s;z-index:3}
  .lb-close{top:calc(16px + env(safe-area-inset-top,0));right:16px;width:46px;height:46px;font-size:22px}
  .lb-nav{top:50%;transform:translateY(-50%);width:52px;height:52px;font-size:26px}
  .lb-nav.prev{left:14px}.lb-nav.next{right:14px}
  .lb-close:hover,.lb-nav:hover{background:rgba(255,255,255,.3)}
  .lb-bar{position:absolute;bottom:calc(18px + env(safe-area-inset-bottom,0));left:50%;transform:translateX(-50%);
    display:flex;gap:10px;align-items:center;z-index:3}
  .lb-bar .lbl{color:#fff;font-size:13px;letter-spacing:.05em;align-self:center;margin-right:4px;opacity:.85}
  .lb-act{background:rgba(255,255,255,.16);color:#fff;border:none;cursor:pointer;padding:10px 16px;border-radius:100px;
    font-family:'Jost';font-size:13px;display:inline-flex;gap:7px;align-items:center;transition:.2s}
  .lb-act:hover{background:rgba(255,255,255,.3)}
  .lb-act.gold{background:var(--gold)}.lb-act.gold:hover{background:#b9975a}
  .lb-act svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:1.8}

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(160%);background:var(--ink);color:#fff;
    padding:13px 24px;border-radius:100px;font-size:14px;box-shadow:var(--shadow);z-index:150;transition:.35s;max-width:90vw;text-align:center}
  .toast.show{transform:translateX(-50%) translateY(0)}

  footer{text-align:center;padding:44px 20px calc(60px + env(safe-area-inset-bottom,0));color:var(--muted);font-size:13px;
    letter-spacing:.06em;border-top:1px solid var(--line)}
  footer .names{font-family:'Cormorant Garamond';font-size:1.5rem;color:var(--ink);margin-bottom:6px}

  @media(max-width:900px){ .gallery{columns:3 200px} }
  @media(max-width:640px){
    .hero{min-height:74vh;min-height:74svh;padding:50px 20px}
    .gallery{columns:2 150px;column-gap:10px}
    .card{margin-bottom:10px;border-radius:12px}
    .card .ov{opacity:1;background:linear-gradient(to top,rgba(40,38,33,.3),transparent 42%)}
    .icon-btn{width:36px;height:36px}
    .sec{margin-top:36px}
    .lb-nav{width:44px;height:44px;font-size:22px}
    .lb-act{padding:10px 14px}
  }
  @media(max-width:380px){ .gallery{columns:2 130px} }
</style>
</head>
<body>

  <!-- ===== PIN GATE ===== -->
  <div class="gate" id="gate" style="display:none">
    <div class="gate__bg" id="gate-bg"></div>
    <div class="gate__card">
      <div class="eyebrow" id="g-eyebrow">Il nostro matrimonio</div>
      <h1>Alica <span class="amp">&amp;</span> Emanuele</h1>
      <p id="g-prompt">Inserisci il PIN per accedere alle foto</p>
      <div class="pin-row">
        <input id="pin-input" type="password" inputmode="numeric" autocomplete="off" placeholder="PIN">
        <button id="pin-btn">Entra</button>
      </div>
      <div class="err" id="pin-err">PIN errato</div>
      <div class="glang" id="lang-gate">
        <button data-lang="it" class="active">IT</button>
        <button data-lang="de">DE</button>
      </div>
    </div>
  </div>

  <!-- ===== SITO ===== -->
  <div id="site" style="display:none">
    <header class="hero" id="hero">
      <div class="hero__bg" id="hero-bg"></div>
      <div class="hero__inner">
        <div class="eyebrow" id="t-eyebrow">Il nostro matrimonio</div>
        <h1>Alica <span class="amp">&amp;</span> Emanuele</h1>
        <div class="date" id="wedding-date"></div>
        <div class="divider"></div>
        <p class="intro" id="t-intro"></p>
      </div>
      <div class="scroll-cue">&#8595;</div>
    </header>

    <nav class="toolbar">
      <span class="count"><b id="photo-count">0</b> <span id="t-count-label">foto</span></span>
      <div class="tools">
        <div class="lang" id="lang" role="group" aria-label="Lingua / Sprache">
          <button data-lang="it" class="active">IT</button>
          <button data-lang="de">DE</button>
        </div>
        <button class="btn" id="download-all" disabled>
          <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
          <span id="t-dlall">Scarica tutte</span>
        </button>
      </div>
    </nav>

    <main class="wrap">
      <div id="sections"></div>
      <div class="status" id="status"><div class="spinner"></div><p id="t-loading">Carico le foto…</p></div>
    </main>

    <footer>
      <div class="names">Alica &amp; Emanuele</div>
      <div id="footer-tag">Con amore &middot; grazie di cuore</div>
    </footer>
  </div>

  <!-- ===== LIGHTBOX ===== -->
  <div class="lb" id="lb">
    <button class="lb-close" id="lb-close" aria-label="Chiudi">&times;</button>
    <button class="lb-nav prev" id="lb-prev" aria-label="Precedente">&#8249;</button>
    <div class="lb__stage" id="lb-stage"><img id="lb-img" src="" alt=""></div>
    <button class="lb-nav next" id="lb-next" aria-label="Successiva">&#8250;</button>
    <div class="lb-bar">
      <span class="lbl" id="lb-counter"></span>
      <button class="lb-act" id="lb-zoom" title="Ingrandisci">
        <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3M11 8v6M8 11h6"/></svg>
        <span id="t-zoom">Ingrandisci</span>
      </button>
      <button class="lb-act gold" id="lb-download">
        <svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg>
        <span id="t-dlone">Scarica</span>
      </button>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
const IMG_RE = /\.(jpe?g|png|gif|webp|avif)$/i;
const $ = id => document.getElementById(id);
const configured = () => CONFIG.user && !/TUO-USERNAME/i.test(CONFIG.user);
let photos = [], current = 0;

/* ---------------- LINGUE ---------------- */
const I18N = {
  it:{ htmlLang:"it", eyebrow:"Il nostro matrimonio",
    intro:"Grazie per aver condiviso con noi questo giorno. Guardate le foto, ingranditele e scaricate le vostre preferite.",
    count:"foto", dlall:"Scarica tutte", dlone:"Scarica", zoom:"Ingrandisci",
    loading:"Carico le foto…", footer:"Con amore · grazie di cuore",
    gatePrompt:"Inserisci il PIN per accedere alle foto", gateBtn:"Entra", gateErr:"PIN errato", gatePh:"PIN",
    emptyT:"Ancora nessuna foto", emptyP:f=>`Caricate le immagini nella cartella <code>${f}/</code> e appariranno qui.`,
    localT:"Anteprima locale", localP:"Online le foto si caricano da sole dalla cartella GitHub.",
    prep:(a,b)=>`Preparo ${a} di ${b}…`, zipmsg:"Creo il file zip…", done:"Fatto! Download avviato",
    sec:{cerimonia:"Cerimonia", esterni:"Esterni", festa:"Festa", _other:"Altre foto"} },
  de:{ htmlLang:"de", eyebrow:"Unsere Hochzeit",
    intro:"Danke, dass ihr diesen Tag mit uns geteilt habt. Schaut euch die Fotos an, vergrößert sie und ladet eure Lieblingsbilder herunter.",
    count:"Fotos", dlall:"Alle herunterladen", dlone:"Herunterladen", zoom:"Vergrößern",
    loading:"Fotos werden geladen…", footer:"In Liebe · von Herzen danke",
    gatePrompt:"Gib die PIN ein, um die Fotos zu sehen", gateBtn:"Los", gateErr:"Falsche PIN", gatePh:"PIN",
    emptyT:"Noch keine Fotos", emptyP:f=>`Ladet die Bilder in den Ordner <code>${f}/</code> hoch.`,
    localT:"Lokale Vorschau", localP:"Online werden die Fotos automatisch aus dem GitHub-Ordner geladen.",
    prep:(a,b)=>`Bereite ${a} von ${b} vor…`, zipmsg:"ZIP-Datei wird erstellt…", done:"Fertig! Download gestartet",
    sec:{cerimonia:"Trauung", esterni:"Draußen", festa:"Feier", _other:"Weitere Fotos"} }
};
let lang = localStorage.getItem('ae_lang') || (navigator.language||'it').slice(0,2);
if(!I18N[lang]) lang = 'it';
const T = () => I18N[lang];

function applyLang(){
  const t = T();
  document.documentElement.lang = t.htmlLang;
  // gate
  $('g-eyebrow').textContent = t.eyebrow;
  $('g-prompt').textContent = t.gatePrompt;
  $('pin-btn').textContent = t.gateBtn;
  $('pin-err').textContent = t.gateErr;
  $('pin-input').placeholder = t.gatePh;
  // sito
  $('t-eyebrow').textContent = t.eyebrow;
  $('t-intro').textContent = t.intro;
  $('t-count-label').textContent = t.count;
  $('t-dlall').textContent = t.dlall;
  $('t-loading').textContent = t.loading;
  $('t-dlone').textContent = t.dlone;
  $('t-zoom').textContent = t.zoom;
  $('footer-tag').textContent = t.footer;
  document.querySelectorAll('#lang button,#lang-gate button').forEach(b=>b.classList.toggle('active', b.dataset.lang===lang));
  if(state==='done') relabelSections(); else renderStatus();
}
function onLangClick(e){ const b=e.target.closest('button'); if(!b) return;
  lang=b.dataset.lang; localStorage.setItem('ae_lang',lang); applyLang(); }
$('lang').addEventListener('click', onLangClick);
$('lang-gate').addEventListener('click', onLangClick);

/* ---------------- PIN GATE ---------------- */
function initGate(){
  applyLang();
  const needPin = CONFIG.pin && CONFIG.pin.length>0;
  const unlocked = !needPin || localStorage.getItem('ae_ok')==='1';
  if(unlocked){ openSite(); return; }
  $('gate').style.display='flex';
  if(CONFIG.cover){
    const src = configured() ? raw(CONFIG.cover) : CONFIG.cover;
    const im=new Image(); im.onload=()=>$('gate-bg').style.backgroundImage=`url("${src}")`; im.src=src;
  }
  const tryPin=()=>{
    if($('pin-input').value.trim()===String(CONFIG.pin)){ localStorage.setItem('ae_ok','1');
      $('gate').style.opacity='0'; setTimeout(()=>{ $('gate').style.display='none'; openSite(); },420); }
    else { $('pin-err').classList.add('show'); $('pin-input').value=''; $('pin-input').focus(); }
  };
  $('pin-btn').onclick=tryPin;
  $('pin-input').addEventListener('keydown',e=>{ if(e.key==='Enter') tryPin(); });
  $('pin-input').focus();
}
function openSite(){ $('site').style.display='block'; start(); }
const raw = p => `https://raw.githubusercontent.com/${CONFIG.user}/${CONFIG.repo}/${CONFIG.branch}/${p}`;

/* ---------------- CARICAMENTO ---------------- */
let state = 'loading';
async function start(){
  $('wedding-date').textContent = CONFIG.data || '';
  setCover();
  if(configured()){ try{ await loadFromGitHub(); }catch(e){ await loadFromLocal(); } }
  else { await loadFromLocal(); }
  render();
}
function setCover(){
  if(!CONFIG.cover) return;
  const src = configured() ? raw(CONFIG.cover) : CONFIG.cover;
  const im=new Image(); im.onload=()=>{ $('hero-bg').style.backgroundImage=`url("${src}")`; $('hero').classList.add('has-cover'); }; im.src=src;
}
async function loadFromGitHub(){
  const api=`https://api.github.com/repos/${CONFIG.user}/${CONFIG.repo}/contents/${CONFIG.folder}?ref=${CONFIG.branch}`;
  const res=await fetch(api); if(!res.ok) throw new Error('API '+res.status);
  const items=await res.json();
  photos=items.filter(f=>f.type==='file'&&IMG_RE.test(f.name))
    .sort((a,b)=>a.name.localeCompare(b.name,'it',{numeric:true}))
    .map(f=>({name:f.name,url:f.download_url,sec:sectionOf(f.name)}));
}
async function loadFromLocal(){
  try{ const res=await fetch('photos.json?v='+Date.now()); const data=await res.json(); const list=data.photos||data;
    photos=list.map(p=>{const n=typeof p==='string'?p:p.file; return {name:n,url:'photos/'+encodeURIComponent(n),sec:sectionOf(n)};});
  }catch(e){ photos=[]; }
}
function sectionOf(name){ if(!CONFIG.sections) return ''; const m=name.match(/^\d+-([a-zA-Zàèéìòù]+)_/i); return m?m[1].toLowerCase():''; }
function secName(slug){ const s=T().sec; return s[slug] || (slug? slug.charAt(0).toUpperCase()+slug.slice(1) : s._other); }

function renderStatus(){
  const s=$('status'), t=T();
  if(state==='loading'){ s.style.display=''; s.innerHTML='<div class="spinner"></div><p>'+t.loading+'</p>'; }
  else if(state==='empty'){ s.style.display='';
    s.innerHTML = configured() ? '<h3>'+t.emptyT+'</h3><p>'+t.emptyP(CONFIG.folder)+'</p>' : '<h3>'+t.localT+'</h3><p>'+t.localP+'</p>'; }
  else s.style.display='none';
}
function relabelSections(){ document.querySelectorAll('.sec-head h2').forEach(h=>{ h.textContent=secName(h.dataset.slug); }); }

/* ---------------- RENDER ---------------- */
function render(){
  $('photo-count').textContent = photos.length;
  const box=$('sections'); box.innerHTML='';
  if(!photos.length){ state='empty'; renderStatus(); return; }
  state='done'; renderStatus(); $('download-all').disabled=false;

  const io=new IntersectionObserver(ents=>ents.forEach(en=>{ if(en.isIntersecting){ en.target.classList.add('in'); io.unobserve(en.target); }}),{threshold:.05});
  let curSec=null, gallery=null;
  photos.forEach((p,i)=>{
    if(CONFIG.sections && p.sec!==curSec){
      curSec=p.sec;
      const grp=photos.filter(x=>x.sec===p.sec).length;
      const sec=document.createElement('section'); sec.className='sec';
      sec.innerHTML='<div class="sec-head"><h2 data-slug="'+(p.sec||'')+'">'+secName(p.sec)+'</h2><span class="ln"></span><span class="n">'+grp+'</span></div><div class="gallery"></div>';
      box.appendChild(sec); gallery=sec.querySelector('.gallery');
    } else if(!gallery){
      const sec=document.createElement('section'); sec.className='sec'; sec.innerHTML='<div class="gallery"></div>';
      box.appendChild(sec); gallery=sec.querySelector('.gallery');
    }
    const card=document.createElement('figure'); card.className='card';
    const img=new Image(); img.loading='lazy'; img.alt=secName(p.sec); img.src=p.url;
    img.onerror=()=>{ card.remove(); }; // niente buchi se una foto non carica
    const ov=document.createElement('div'); ov.className='ov';
    ov.innerHTML='<button class="icon-btn" title="Scarica"><svg viewBox="0 0 24 24"><path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14"/></svg></button>';
    ov.querySelector('button').addEventListener('click',ev=>{ev.stopPropagation();downloadOne(i);});
    card.appendChild(img); card.appendChild(ov);
    card.addEventListener('click',()=>openLb(i));
    gallery.appendChild(card); io.observe(card);
  });
}

/* ---------------- DOWNLOAD ---------------- */
async function downloadOne(i){ const p=photos[i];
  try{ const b=await (await fetch(p.url)).blob(); saveBlob(b,p.name); }catch(e){ window.open(p.url,'_blank'); } }
function saveBlob(blob,name){ const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(url),1500); }
$('download-all').addEventListener('click', async ()=>{
  if(!photos.length) return; const btn=$('download-all'); btn.disabled=true;
  const zip=new JSZip(); const folder=zip.folder('Alica-Emanuele-Foto');
  for(let i=0;i<photos.length;i++){ toast(T().prep(i+1,photos.length));
    try{ const b=await (await fetch(photos[i].url)).blob(); folder.file(photos[i].name,b); }catch(e){} }
  toast(T().zipmsg); const out=await zip.generateAsync({type:'blob'});
  saveBlob(out,'Alica-Emanuele-Foto.zip'); toast(T().done,2800); btn.disabled=false;
});

/* ---------------- LIGHTBOX + ZOOM ---------------- */
let zoom=1, panX=0, panY=0, drag=false, dsx=0, dsy=0, dpx=0, dpy=0;
const img=$('lb-img');
function applyT(){ img.style.transform=`translate(${panX}px,${panY}px) scale(${zoom})`; img.classList.toggle('zoomed',zoom>1); }
function resetZoom(){ zoom=1; panX=panY=0; applyT(); }
function openLb(i){ current=i; img.src=photos[i].url; $('lb-counter').textContent=(i+1)+' / '+photos.length;
  resetZoom(); $('lb').classList.add('open'); document.body.style.overflow='hidden'; }
function closeLb(){ $('lb').classList.remove('open'); document.body.style.overflow=''; resetZoom(); }
function nav(d){ if(zoom>1) return; current=(current+d+photos.length)%photos.length; openLb(current); }
function toggleZoom(){ zoom = zoom>1 ? 1 : 2.4; panX=panY=0; applyT(); }
$('lb-close').onclick=closeLb; $('lb-prev').onclick=e=>{e.stopPropagation();nav(-1);}; $('lb-next').onclick=e=>{e.stopPropagation();nav(1);};
$('lb-zoom').onclick=e=>{e.stopPropagation();toggleZoom();};
$('lb-download').onclick=e=>{e.stopPropagation();downloadOne(current);};
img.addEventListener('dblclick',e=>{e.stopPropagation();toggleZoom();});
// chiudi cliccando lo sfondo (non l'immagine)
$('lb').addEventListener('click',e=>{ if(e.target.id==='lb'||e.target.id==='lb-stage') closeLb(); });
document.addEventListener('keydown',e=>{ if(!$('lb').classList.contains('open')) return;
  if(e.key==='Escape') closeLb(); if(e.key==='ArrowLeft') nav(-1); if(e.key==='ArrowRight') nav(1); });

// PAN col mouse/dito quando ingrandito
img.addEventListener('pointerdown',e=>{ if(zoom<=1) return; drag=true; dsx=e.clientX; dsy=e.clientY; dpx=panX; dpy=panY; img.setPointerCapture(e.pointerId); });
img.addEventListener('pointermove',e=>{ if(!drag) return; panX=dpx+(e.clientX-dsx); panY=dpy+(e.clientY-dsy); applyT(); });
img.addEventListener('pointerup',()=>{ drag=false; });
img.addEventListener('pointercancel',()=>{ drag=false; });
// SWIPE per navigare (solo se non ingrandito)
let tsx=0,tsy=0;
$('lb').addEventListener('touchstart',e=>{ tsx=e.changedTouches[0].clientX; tsy=e.changedTouches[0].clientY; },{passive:true});
$('lb').addEventListener('touchend',e=>{ if(zoom>1) return;
  const dx=e.changedTouches[0].clientX-tsx, dy=e.changedTouches[0].clientY-tsy;
  if(Math.abs(dx)>50 && Math.abs(dx)>Math.abs(dy)) nav(dx<0?1:-1);
  else if(dy>90 && Math.abs(dy)>Math.abs(dx)) closeLb();
},{passive:true});
// zoom con rotellina su desktop
$('lb').addEventListener('wheel',e=>{ if(!$('lb').classList.contains('open')) return; e.preventDefault();
  zoom=Math.min(4,Math.max(1, zoom + (e.deltaY<0?0.25:-0.25))); if(zoom===1){panX=panY=0;} applyT();
},{passive:false});

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(msg,hide){ const t=$('toast'); t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer); if(hide) toastTimer=setTimeout(()=>t.classList.remove('show'),hide); }

initGate();
</script>
